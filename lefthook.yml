pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: gitleaks protect --staged --verbose

    - name: validate helm & k8s
      glob:
        - "apps/**/*"
        - "platform/**/*"
        - "bootstrap/**/*"
      run: just lint-helm && just lint-k8s

    - name: shellcheck
      glob:
        - "**/*.sh"
      run: shellcheck --severity=warning {staged_files}

    - name: shfmt
      glob:
        - "**/*.sh"
      run: shfmt -w {staged_files}
      stage_fixed: true

    - name: actionlint
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
      run: actionlint {staged_files}

    - name: rumdl
      glob:
        - "**/*.md"
      run: rumdl fmt {staged_files}
      stage_fixed: true


pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged

    validate-k8s:
      glob: "{apps,platform,bootstrap}/**/*.{yaml,yml}"
      run: just validate

    shell:
      glob: "**/*.sh"
      run: shfmt -w {staged_files} && shellcheck --severity=warning {staged_files}
      stage_fixed: true

    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

    rumdl:
      glob: "**/*.md"
      run: rumdl fmt {staged_files}
      stage_fixed: true

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-config
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: garage-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: storage/garage-config
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: garage-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: storage/garage-secrets

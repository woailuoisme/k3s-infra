apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-init
  namespace: storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-init
  namespace: storage
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-init
  namespace: storage
subjects:
  - kind: ServiceAccount
    name: garage-init
    namespace: storage
roleRef:
  kind: Role
  name: garage-init
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
  namespace: storage
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      name: garage-init
    spec:
      serviceAccountName: garage-init
      restartPolicy: OnFailure
      containers:
        - name: init
          image: bitnami/kubectl:1.32.2
          imagePullPolicy: IfNotPresent
          env:
            - name: GARAGE_DEFAULT_ACCESS_KEY
              value: "GK_replace_with_garage_access_key"
            - name: GARAGE_DEFAULT_SECRET_KEY
              value: "replace_with_garage_secret_key_hex_64_chars"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "[Garage Init] Waiting for Garage Pod to become ready..."
              kubectl wait --for=condition=ready pod/garage-0 -n storage --timeout=180s

              echo "[Garage Init] Checking Garage cluster status..."
              kubectl exec -n storage garage-0 -c garage -- /garage status

              echo "[Garage Init] Checking cluster layout..."
              LAYOUT_INFO=$(kubectl exec -n storage garage-0 -c garage -- /garage layout show 2>/dev/null || true)
              if echo "${LAYOUT_INFO}" | grep -q "Current cluster layout version: 0" || ! echo "${LAYOUT_INFO}" | grep -q "==== CURRENT CLUSTER LAYOUT ===="; then
                NODE_FULL_ID=$(kubectl exec -n storage garage-0 -c garage -- /garage node id | head -n1 | cut -d'@' -f1)
                NODE_ID=$(echo "${NODE_FULL_ID}" | cut -c1-16)
                echo "[Garage Init] Assigning layout to node ${NODE_ID} (zone: dc1, capacity: 100G)..."
                kubectl exec -n storage garage-0 -c garage -- /garage layout assign -z dc1 -c 100G "${NODE_ID}"
                kubectl exec -n storage garage-0 -c garage -- /garage layout apply --version 1 || true
              else
                echo "[Garage Init] Cluster layout is already initialized."
              fi

              echo "[Garage Init] Ensuring access key..."
              EXISTING_KEYS=$(kubectl exec -n storage garage-0 -c garage -- /garage key list 2>/dev/null || true)
              if echo "${EXISTING_KEYS}" | grep -qw "default"; then
                echo "[Garage Init] Key 'default' already exists."
              elif [ -n "${GARAGE_DEFAULT_ACCESS_KEY:-}" ] && [ -n "${GARAGE_DEFAULT_SECRET_KEY:-}" ] && [ "${GARAGE_DEFAULT_ACCESS_KEY}" != "GK_replace_with_garage_access_key" ]; then
                echo "[Garage Init] Importing key 'default'..."
                kubectl exec -n storage garage-0 -c garage -- /garage key import -n default "${GARAGE_DEFAULT_ACCESS_KEY}" "${GARAGE_DEFAULT_SECRET_KEY}" --yes || true
              else
                echo "[Garage Init] Creating new key 'default'..."
                kubectl exec -n storage garage-0 -c garage -- /garage key create default || true
              fi

              echo "[Garage Init] Ensuring buckets and permissions..."
              EXISTING_BUCKETS=$(kubectl exec -n storage garage-0 -c garage -- /garage bucket list 2>/dev/null || true)
              for BUCKET in default bgin; do
                if echo "${EXISTING_BUCKETS}" | grep -qw "${BUCKET}"; then
                  echo "[Garage Init] Bucket '${BUCKET}' already exists."
                else
                  echo "[Garage Init] Creating bucket '${BUCKET}'..."
                  kubectl exec -n storage garage-0 -c garage -- /garage bucket create "${BUCKET}" || true
                fi

                echo "[Garage Init] Granting permissions on '${BUCKET}' to key 'default'..."
                if [ "${BUCKET}" = "bgin" ]; then
                  kubectl exec -n storage garage-0 -c garage -- /garage bucket allow "${BUCKET}" --key default --read --write --owner || true
                else
                  kubectl exec -n storage garage-0 -c garage -- /garage bucket allow "${BUCKET}" --key default --read --write || true
                fi
              done

              echo "[Garage Init] Initialization finished successfully."
              kubectl exec -n storage garage-0 -c garage -- /garage bucket list
              kubectl exec -n storage garage-0 -c garage -- /garage key list

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-backup-secret
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: rclone-backup-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: storage/rclone-backup-secret

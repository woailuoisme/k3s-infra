---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authelia-secret
  namespace: security
spec:
  encryptedData:
    JWT_SECRET: 
    SESSION_SECRET: 
    STORAGE_ENCRYPTION_KEY: 
    identity_validation.reset_password.jwt.hmac.key: 
    jwt-secret: 
    session-secret: 
    session.encryption.key: 
    storage-encryption-key: 
    storage.encryption.key: 
  template:
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
      name: authelia-secret
      namespace: security
    type: Opaque

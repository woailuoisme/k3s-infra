apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secret
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: authelia-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: security/authelia-secret

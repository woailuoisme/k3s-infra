apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secret
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: authelia-secret
    creationPolicy: Owner
  data:
    - secretKey: identity_validation.reset_password.jwt.hmac.key
      remoteRef:
        key: security/authelia-secret
        property: JWT_SECRET
    - secretKey: session.encryption.key
      remoteRef:
        key: security/authelia-secret
        property: SESSION_SECRET
    - secretKey: storage.encryption.key
      remoteRef:
        key: security/authelia-secret
        property: STORAGE_ENCRYPTION_KEY
    - secretKey: JWT_SECRET
      remoteRef:
        key: security/authelia-secret
        property: JWT_SECRET
    - secretKey: SESSION_SECRET
      remoteRef:
        key: security/authelia-secret
        property: SESSION_SECRET
    - secretKey: STORAGE_ENCRYPTION_KEY
      remoteRef:
        key: security/authelia-secret
        property: STORAGE_ENCRYPTION_KEY

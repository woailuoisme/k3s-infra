# ==============================================================================
# Authelia 官方 Helm Chart 调优配置 (适用于 4C8G 单机 K3s)
# 采用本地 SQLite3 + 加密 Cookie 会话，零外部数据库依赖 (无 Postgres / Redis 依赖)
# ==============================================================================

pod:
  kind: "Deployment"
  replicas: 1
  priorityClassName: "platform-standard"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi
  extraVolumes:
    - name: users-database
      configMap:
        name: authelia-users
  extraVolumeMounts:
    - name: users-database
      mountPath: /config/users_database.yml
      subPath: users_database.yml
      readOnly: true

# 暴露 Service 端口 9091 (对齐 Traefik ForwardAuth 中间件与 IngressRoute)
service:
  port: 9091

# 持久化存储 SQLite3 数据库 (local-path PVC 挂载至 /config)
persistence:
  enabled: true
  storageClass: "local-path"
  size: 100Mi

configMap:
  theme: dark
  server:
    buffers:
      read: 4096
      write: 4096

  # 会话存储 (基于 session.encryption.key 进行客户端加密 Cookie 验证，零 Redis 依赖)
  session:
    cookies:
      - domain: "mso.lol"
        subdomain: "auth"

  # 持久化存储 (内嵌轻量级 SQLite3 引擎，零网络开销与零数据库外部依赖)
  storage:
    local:
      enabled: true
      path: /config/db.sqlite3

  # 认证用户源 (文件后端，挂载 authelia-users ConfigMap)
  authentication_backend:
    file:
      enabled: true
      path: /config/users_database.yml
      watch: true
      search:
        email: true
        case_insensitive: true

  # 通知后端 (轻量文件通知)
  notifier:
    filesystem:
      enabled: true
      filename: /config/notification.txt

  # 统一访问控制策略 (ACL - 对齐生产)
  access_control:
    default_policy: deny
    rules:
      - domain:
          - "auth.mso.lol"
        policy: bypass
      - domain:
          - "api.mso.lol"
        resources:
          - "^/docs/admin.*"
        policy: one_factor
        subject:
          - "group:admin"
      - domain:
          - "api.mso.lol"
        resources:
          - "^/docs.*"
        policy: one_factor
      - domain:
          - "*.mso.lol"
        policy: one_factor
        subject:
          - "group:admin"

# 敏感密钥绑定集群内部 Secret (由 SealedSecret 解密注入)
secret:
  existingSecret: authelia-secret

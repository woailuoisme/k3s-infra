# ==============================================================================
# CrowdSec 生产级入侵防御与 LAPI 引擎 (适用于 4C8G 单机 K3s)
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-data
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "local-path"
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-acquis
  namespace: security
data:
  traefik.yaml: |
    # 采集 Traefik 访问日志或通过 AppSec 协议监听
    source: appsec
    listen_addr: 0.0.0.0:7422
    appsec_configs:
      - crowdsecurity/appsec-default
    labels:
      type: appsec
---
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-secrets
  namespace: security
type: Opaque
stringData:
  traefik-bouncer-key: "5c30d79acd60832cd4c6712dfbb472e2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec
    spec:
      priorityClassName: platform-standard
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:v1.8.1-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: USE_WAL
              value: "true"
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors crowdsecurity/base-http-scenarios crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
            - name: APPSEC_CONFIGS
              value: "crowdsecurity/appsec-default"
            - name: BOUNCER_KEY_traefik
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: traefik-bouncer-key
                  optional: true
          ports:
            - name: lapi
              containerPort: 8080
            - name: appsec
              containerPort: 7422
            - name: metrics
              containerPort: 6060
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/crowdsec/data
            - name: acquis
              mountPath: /etc/crowdsec/acquis.d/traefik.yaml
              subPath: traefik.yaml
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crowdsec-data
        - name: acquis
          configMap:
            name: crowdsec-acquis
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-service
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crowdsec
  ports:
    - name: lapi
      port: 8080
      targetPort: lapi
    - name: appsec
      port: 7422
      targetPort: appsec
    - name: metrics
      port: 6060
      targetPort: metrics
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: security
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      logLevel: "INFO"
      crowdsecLapiUrl: "http://crowdsec-service.security.svc:8080"
      crowdsecLapiHeaderAuthKey: "5c30d79acd60832cd4c6712dfbb472e2"
      redisCacheEnabled: false

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-secrets
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: crowdsec-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: security/crowdsec-secrets

# ==============================================================================
# Asynq 分布式异步任务队列 Web 监控看板 (适用于 4C8G 单机 K3s)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asynqmon
  namespace: workflows
  labels:
    app.kubernetes.io/name: asynqmon
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: asynqmon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asynqmon
    spec:
      priorityClassName: platform-standard
      containers:
        - name: asynqmon
          image: hibiken/asynqmon:0.7.2
          imagePullPolicy: IfNotPresent
          args:
            - "--redis-addr=valkey-primary.database.svc:6379"
            - "--redis-password=$(REDIS_PASSWORD)"
            - "--redis-db=0"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-secret
                  key: password
                  optional: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: asynqmon
  namespace: workflows
  labels:
    app.kubernetes.io/name: asynqmon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: asynqmon
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: valkey-secret
  namespace: workflows
type: Opaque
stringData:
  password: "redis_secret"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: asynqmon
  namespace: workflows
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`asynq.mso.lol`)
      kind: Rule
      middlewares:
        - name: chain-auth
          namespace: traefik
      services:
        - name: asynqmon
          port: 8080
  tls:
    certResolver: cloudflare

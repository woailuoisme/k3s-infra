# ==============================================================================
# Temporal 分布式微服务编排与持久工作流引擎 (适用于 4C8G 单机 K3s)
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-data
  namespace: workflows
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "local-path"
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: workflows
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      priorityClassName: platform-standard
      securityContext:
        fsGroup: 1000
      containers:
        - name: temporal
          image: temporalio/temporal:1.9.1
          imagePullPolicy: IfNotPresent
          command:
            - temporal
            - server
            - start-dev
            - --ip=0.0.0.0
            - --port=7233
            - --ui-port=8233
            - --db-filename=/etc/temporal/temporal.db
            - --namespace=default
            - --metrics-port=9090
          ports:
            - name: grpc
              containerPort: 7233
            - name: ui
              containerPort: 8233
            - name: metrics
              containerPort: 9090
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: TEMPORAL_CSRF_COOKIE_INSECURE
              value: "true"
            - name: TEMPORAL_CLI_ADDRESS
              value: "127.0.0.1:7233"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /etc/temporal
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: temporal-data
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: workflows
  labels:
    app.kubernetes.io/name: temporal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
    - name: ui
      port: 8233
      targetPort: ui
    - name: metrics
      port: 9090
      targetPort: metrics

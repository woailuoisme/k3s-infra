# ==============================================================================
# Traefik v3 官方 Helm Chart 调优配置 (适用于 4C8G 单机 K3s)
# ==============================================================================

deployment:
  replicas: 1

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

priorityClassName: "edge-critical"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 150Mi

# ------------------------------------------------------------------------------
# 端口与入口点配置 (EntryPoints)
# ------------------------------------------------------------------------------
ports:
  # HTTP 入口 (默认 301 永久重定向至 HTTPS)
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # HTTPS 入口 (开启 HTTP/3)
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    hostPort: 443
    http3:
      enabled: true

  # 内部 Prometheus 监控端点
  metrics:
    port: 8082
    expose:
      default: false

  # IoT 售货机硬件直连 MQTT TCP 端口
  mqtt:
    port: 1883
    expose:
      default: true
    exposedPort: 1883
    hostPort: 1883
    protocol: TCP

# ------------------------------------------------------------------------------
# 单机 K3s 禁用 ServiceLB 环境下的 Service 配置 (避免 LoadBalancer 挂起 Progressing)
# ------------------------------------------------------------------------------
service:
  enabled: true
  single: true
  spec:
    type: ClusterIP

# ------------------------------------------------------------------------------
# 证书存储与 Let's Encrypt ACME 原生签发
# ------------------------------------------------------------------------------
persistence:
  enabled: true
  storageClass: "local-path"
  size: 1Gi
  path: /data

certificatesResolvers:
  cloudflare:
    acme:
      email: admin@mso.lol
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

# 从 Secret 注入 Cloudflare API 凭证 (由 SealedSecret 解密生成)
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: token
        optional: true

# 注入 Traefik 原生 IngressRoute (API Dashboard 入口)
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: traefik-dashboard-root
    spec:
      entryPoints:
        - websecure
      routes:
        - match: (Host(`gateway.mso.lol`) || Host(`traefik.mso.lol`)) && Path(`/`)
          kind: Rule
          priority: 100
          middlewares:
            - name: chain-auth
            - name: traefik-redirect-dashboard
          services:
            - name: api@internal
              kind: TraefikService
      tls:
        certResolver: cloudflare
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: traefik-dashboard
    spec:
      entryPoints:
        - websecure
      routes:
        - match: Host(`gateway.mso.lol`) || Host(`traefik.mso.lol`)
          kind: Rule
          priority: 10
          middlewares:
            - name: chain-auth
          services:
            - name: api@internal
              kind: TraefikService
      tls:
        certResolver: cloudflare

# ------------------------------------------------------------------------------
# 实验性插件 (CrowdSec Bouncer WAF)
# ------------------------------------------------------------------------------
experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.7.1"

# ------------------------------------------------------------------------------
# 日志与指标
# ------------------------------------------------------------------------------
log:
  level: INFO

accessLog:
  enabled: true
  format: json
  bufferingSize: 100

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

# 开启 IngressRoute CRD 提供者
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true

# ==============================================================================
# Meilisearch 官方 Helm Chart 调优配置 (适用于 4C8G 单机 K3s)
# ==============================================================================

replicaCount: 1

priorityClassName: "platform-standard"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 800m
    memory: 512Mi

# 持久化存储绑定 local-path
persistence:
  enabled: true
  storageClass: "local-path"
  size: 10Gi

# 鉴权凭证绑定外部 Secret (SealedSecret 声明式管理)
auth:
  existingMasterKeySecret: "meilisearch-master-key"

# 生产环境运行模式
environment:
  MEILI_ENV: "production"
  MEILI_NO_ANALYTICS: "true"
  MEILI_LOG_LEVEL: "INFO"

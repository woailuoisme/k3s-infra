apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meilisearch-master-key
  namespace: search
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: meilisearch-master-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: search/meilisearch-master-key

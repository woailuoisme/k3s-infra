# ==============================================================================
# 4C8G 物理硬防护：命名空间资源配额上限 (Namespace ResourceQuotas)
# ==============================================================================
# 作用：限制单命名空间总开销，杜绝偶发性多副本扩容或内存泄漏吞噬 4C8G 宿主机
# 配额上限已包含 RollingUpdate 滚动发布时的冗余缓冲 (Surge Buffer)
# ==============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: traefik
spec:
  hard:
    requests.cpu: "1000m"
    requests.memory: "384Mi"
    limits.cpu: "2000m"
    limits.memory: "768Mi"
    pods: "6"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: storage
spec:
  hard:
    requests.cpu: "1000m"
    requests.memory: "512Mi"
    limits.cpu: "2000m"
    limits.memory: "1024Mi"
    pods: "8"
    persistentvolumeclaims: "4"
---

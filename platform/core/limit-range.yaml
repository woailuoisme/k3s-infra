# ==============================================================================
# 4C8G 命名空间默认防爆 LimitRange (Default Resource Guardians)
# ==============================================================================
# 作用：任何未显式声明 resources 的容器，将强制注入保底与上限配额，杜绝单 Pod 击垮 4C8G 宿主机
# ==============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limit-range
  namespace: apps
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: 1500m
        memory: 1024Mi
      min:
        cpu: 10m
        memory: 16Mi
---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: imgproxy-secrets
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: imgproxy-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: media/imgproxy-secrets

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-secret
  namespace: messaging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: valkey-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: messaging/valkey-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: centrifugo-secrets
  namespace: messaging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: centrifugo-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: messaging/centrifugo-secrets

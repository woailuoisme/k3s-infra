# ==============================================================================
# Eclipse Mosquitto MQTT 物联网与设备消息 Broker (适用于 4C8G 单机 K3s)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: messaging
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    protocol mqtt
    set_tcp_nodelay true

    listener 9001 0.0.0.0
    protocol websockets

    allow_anonymous false
    password_file /mosquitto/config/passwd
    acl_file /mosquitto/config/acl

    persistence true
    persistence_location /mosquitto/data/
    persistence_file mosquitto.db
    autosave_interval 300
    autosave_on_changes false
    persistent_client_expiration 1d

    max_packet_size 10485760
    max_queued_messages 2000
    max_inflight_messages 40
    max_connections -1
    log_dest stdout
  acl: |
    # 超级管理员 (Admin) 完全读写权限
    user admin
    topic readwrite #
    topic readwrite $SYS/#

    # 租户与 IoT 设备模式化隔离 (Pattern ACL - 行业设备规范)
    # %u = 客户端认证用户名 (Username)
    # %c = 客户端唯一标识 (Client ID)
    pattern readwrite %u/#
    pattern readwrite device/%u/#
    pattern readwrite devices/%c/#
---
apiVersion: v1
kind: Secret
metadata:
  name: mosquitto-auth
  namespace: messaging
type: Opaque
stringData:
  passwd: |
    # 默认初始账户: admin / admin123 (生产可通过 SOPS + Age 加密)
    admin:$7$101$zR8V05s2GZ+Bf6N0$9f6b4iRzEaZJ2hK
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosquitto
  namespace: messaging
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/part-of: platform
spec:
  serviceName: mosquitto
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
    spec:
      priorityClassName: edge-critical
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
            - name: ws
              containerPort: 9001
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: config
              mountPath: /mosquitto/config/acl
              subPath: acl
            - name: auth
              mountPath: /mosquitto/config/passwd
              subPath: passwd
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: auth
          secret:
            secretName: mosquitto-auth
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "local-path"
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: messaging
  labels:
    app.kubernetes.io/name: mosquitto
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
    - name: ws
      port: 9001
      targetPort: ws
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mosquitto-ws
  namespace: messaging
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mqtt.haoxiaoguai.xyz`)
      kind: Rule
      services:
        - name: mosquitto
          port: 9001
  tls:
    certResolver: cloudflare
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mosquitto-mqtt
  namespace: messaging
spec:
  entryPoints:
    - mqtt
  routes:
    - match: HostSNI(`*`)
      services:
        - name: mosquitto
          port: 1883

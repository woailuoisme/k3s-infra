apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto-auth
  namespace: messaging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: mosquitto-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: messaging/mosquitto-auth

# ==============================================================================
# PostgreSQL 18 配置 (Debian Trixie - 针对 2核/1GB 内存微规格实例调优)
# 遵循极简原则：仅保留核心特化扩展、内存配比、SSD优化、日志与超时保护，其余全走默认
# ==============================================================================

# --- 1. 连接与核心进程 ---
listen_addresses = '*'
max_connections = 50                    # 单机防并发内存耗尽 (默认 100)

# --- 2. 预加载扩展与特化参数 ---
shared_preload_libraries = 'pg_cron,pg_stat_statements'
cron.database_name = 'postgres'          # pg_cron 运行的主库
cron.timezone = 'Asia/Shanghai'          # pg_cron 调度时区
pg_stat_statements.track = all           # 跟踪嵌套语句 (默认 top)

# --- 3. 内存与缓存调优 (基准: 1GB 宿主内存) ---
shared_buffers = 256MB                  # 约占总内存 25% (默认 128MB)
effective_cache_size = 768MB            # 预估 OS + PG 磁盘缓存容量 (默认 4GB)
work_mem = 2MB                          # 单查询排序与哈希操作内存 (默认 4MB)
maintenance_work_mem = 128MB            # 加速 VACUUM 与空间/向量索引构建 (默认 64MB)

# --- 4. WAL 与检查点 ---
wal_compression = lz4                   # 极低 CPU 开销压缩 WAL，缩减磁盘写入 (默认 off)
max_wal_size = 512MB                    # 限制 WAL 占用磁盘空间 (默认 1GB)
checkpoint_timeout = 10min              # 延长检查点平缓写入，降低 I/O 尖峰 (默认 5min)

# --- 5. 存储与 I/O 成本模型 (SSD) ---
random_page_cost = 1.1                  # 贴近 SSD 随机读性能，促使规划器积极使用索引 (默认 4.0)
effective_io_concurrency = 150          # 匹配 SSD 并发预读能力 (默认 1)

# --- 6. 自动清理 (Autovacuum - 双核保护) ---
autovacuum_max_workers = 2              # 限制并发清理进程数，防止抢占 CPU (默认 3)
autovacuum_vacuum_scale_factor = 0.1    # 10% 死元组即触发清理，防止表膨胀 (默认 0.2)
autovacuum_analyze_scale_factor = 0.05  # 5% 数据变更即触发分析 (默认 0.1)
autovacuum_work_mem = 32MB              # 独立限制清理内存，防止维护操作突发占用
log_autovacuum_min_duration = 2000      # 记录清理耗时超 2 秒的操作 (默认 -1)

# --- 7. 日志与慢查询 ---
log_min_duration_statement = 1000       # 慢查询记录阈值 (毫秒) (默认 -1)
log_line_prefix = '%t [%p]: '           # 日志行前缀：格式化时间戳与进程 PID

# --- 8. 超时保护与微型规格优化 ---
statement_timeout = 60000               # 60 秒单语句超时，阻断慢查询堆积 (默认 0)
lock_timeout = 30000                    # 30 秒锁等待超时 (默认 0)
idle_in_transaction_session_timeout = 120000 # 2 分钟事务内空闲超时 (默认 0)
jit = off                               # 2核小规格禁用 JIT 以节省 CPU 与内存开销 (默认 on)

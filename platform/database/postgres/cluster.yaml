# yaml-language-server: $schema=none
# ==============================================================================
# CloudNative-PG (CNPG) Postgres 18 单实例 Cluster (4C8G 精准调优)
# ==============================================================================
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: database
spec:
  instances: 1

  # 边缘 OOM 驱逐最高优先级防护 (核心交易库永不驱逐)
  priorityClassName: edge-critical

  # 预构建 PostgreSQL 18 多模态镜像 (含 PostGIS 3.6, pgvector 0.8, pg_cron 1.6)
  imageName: jiaoio/postgres:18-trixie
  postgresUID: 999
  postgresGID: 999

  # 存储使用 K3s 原生 local-path (NVMe 直挂)
  storage:
    size: 10Gi
    storageClass: "local-path"

  # 4C8G 严苛资源限制
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

  # PostgreSQL 18 参数调优 (合并对齐自 postgresql.conf)
  postgresql:
    shared_preload_libraries:
      - pg_cron
      - pg_stat_statements
    parameters:
      shared_buffers: "256MB"
      work_mem: "4MB"
      maintenance_work_mem: "128MB"
      effective_cache_size: "768MB"
      max_connections: "50"
      timezone: "Asia/Shanghai"
      wal_compression: "lz4"
      max_wal_size: "512MB"
      checkpoint_timeout: "10min"
      "cron.database_name": "postgres"
      "cron.timezone": "Asia/Shanghai"
      "pg_stat_statements.track": "all"
      random_page_cost: "1.1"
      effective_io_concurrency: "150"
      autovacuum_max_workers: "2"
      autovacuum_vacuum_scale_factor: "0.1"
      autovacuum_analyze_scale_factor: "0.05"
      autovacuum_work_mem: "32MB"
      log_min_duration_statement: "1000"
      statement_timeout: "60000"
      lock_timeout: "30000"
      idle_in_transaction_session_timeout: "120000"
      jit: "off"

  # 初始默认数据库与用户
  bootstrap:
    initdb:
      database: bgin
      owner: app
      secret:
        name: postgres-app-credentials
      encoding: UTF8
      localeCollate: "C.UTF-8"
      localeCType: "C.UTF-8"
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_cron;
        - CREATE EXTENSION IF NOT EXISTS dblink;
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE DATABASE authelia OWNER app;
        - GRANT ALL PRIVILEGES ON DATABASE authelia TO app;
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: postgres-init-scripts
            key: 02-iot-vending-schema.sql

  # 原生 Barman S3 持续流式 WAL 归档与备份配置
  # 注：待镜像补齐 barman-cli-cloud 后取消下段注释即可无缝启用 Garage S3 备份
  # backup:
  #   barmanObjectStore:
  #     destinationPath: "s3://postgres-backups/"
  #     endpointURL: "http://garage.storage.svc:3900"
  #     s3Credentials:
  #       accessKeyId:
  #         name: garage-s3-credentials
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: garage-s3-credentials
  #         key: SECRET_ACCESS_KEY
  #     wal:
  #       compression: gzip
  #       maxParallel: 1
  #   retentionPolicy: "14d"

  monitoring:
    enablePodMonitor: false

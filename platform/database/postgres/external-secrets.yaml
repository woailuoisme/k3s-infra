apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: postgres-app-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  dataFrom:
    - extract:
        key: database/postgres-app-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: garage-s3-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: database/garage-s3-credentials

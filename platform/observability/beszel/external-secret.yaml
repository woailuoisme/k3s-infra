apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beszel-agent-secret
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: beszel-agent-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: observability/beszel-agent-secret

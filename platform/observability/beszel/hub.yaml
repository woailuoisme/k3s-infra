apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beszel-hub-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel
  namespace: observability
  labels:
    app.kubernetes.io/name: beszel
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: beszel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beszel
    spec:
      priorityClassName: observability-low
      enableServiceLinks: false
      containers:
        - name: beszel
          image: henrygd/beszel:0.21.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: APP_URL
              value: "https://beszel.mso.lol"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /beszel_data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beszel-hub-data
---
apiVersion: v1
kind: Service
metadata:
  name: beszel
  namespace: observability
  labels:
    app.kubernetes.io/name: beszel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: beszel
  ports:
    - name: http
      port: 8090
      targetPort: 8090

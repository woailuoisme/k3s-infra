apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portainer
  namespace: observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`portainer.mso.lol`)
      kind: Rule
      middlewares:
        - name: chain-basic
          namespace: traefik
        - name: rate-limit
          namespace: traefik
      services:
        - name: portainer
          port: 9000
  tls:
    certResolver: cloudflare

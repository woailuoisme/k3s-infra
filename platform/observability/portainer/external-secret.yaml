apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portainer-admin-password
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: portainer-admin-password
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: observability/portainer-admin-password

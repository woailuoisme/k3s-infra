# ==============================================================================
# OpenObserve Traefik IngressRoute (解耦自 Helm Chart)
# ==============================================================================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openobserve
  namespace: observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`logs.mso.lol`) || Host(`o2.mso.lol`) || Host(`observe.mso.lol`)
      kind: Rule
      services:
        - name: openobserve
          port: 5080
  tls:
    certResolver: cloudflare

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-secrets
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: openobserve-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: observability/openobserve-secrets

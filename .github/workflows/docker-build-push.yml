name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to build and push"
        required: true
        default: "postgres-cnpg"
        type: choice
        options:
          - postgres-cnpg

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: postgres-cnpg
            context: ./platform/database/postgres
            file: ./platform/database/postgres/Dockerfile
            image: postgres-multimodal


    steps:
      - name: Filter service
        if: ${{ inputs.service != 'all' && inputs.service != matrix.service }}
        run: |
          echo "Skipping ${{ matrix.service }} because ${{ inputs.service }} was requested"
          exit 0

      - name: Checkout repository
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        uses: actions/checkout@v7

      - name: Prepare lowercase image name
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        run: |
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${IMAGE_REPO}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

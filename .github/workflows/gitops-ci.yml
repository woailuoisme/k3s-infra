name: GitOps Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Validate GitOps
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up toolchain via Mise
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Install yamllint
        run: pipx install yamllint

      - name: Run Actionlint
        run: actionlint

      - name: Run GitOps Validation
        run: just validate

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgin-api
  namespace: apps
  labels:
    app.kubernetes.io/name: bgin-api
    app.kubernetes.io/part-of: bgin
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: bgin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bgin-api
        app.kubernetes.io/part-of: bgin
    spec:
      priorityClassName: platform-standard
      containers:
        - name: api
          image: ghcr.io/woailuoisme/gin-bun
          imagePullPolicy: IfNotPresent
          command:
            - "/app/bgin"
            - "serve"
          ports:
            - name: http
              containerPort: 3300
          envFrom:
            - configMapRef:
                name: bgin-config
            - secretRef:
                name: bgin-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          readinessProbe:
            tcpSocket:
              port: 3300
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3300
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: bgin-storage

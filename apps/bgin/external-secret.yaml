apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bgin-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: bgin-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/bgin-secret

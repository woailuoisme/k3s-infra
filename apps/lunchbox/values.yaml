# ==============================================================================
# Lunchbox 业务应用 Helm Values (专为 4C8G 优化，与第三方中间件解耦)
# ==============================================================================

replicaCount: 1

image:
  repository: ghcr.io/seaside/lunchbox
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

priorityClassName: "platform-standard"

# 环境变量：无缝对接 platform 层部署的 CNPG Postgres、Valkey 与 Garage S3
env:
  - name: APP_ENV
    value: "production"
  - name: DB_CONNECTION
    value: "pgsql"
  - name: DB_HOST
    value: "postgres-cluster-rw.database.svc"
  - name: DB_PORT
    value: "5432"
  - name: DB_DATABASE
    value: "lunchbox"
  - name: DB_USERNAME
    value: "app"
  - name: REDIS_HOST
    value: "valkey-primary.database.svc"
  - name: REDIS_PORT
    value: "6379"
  - name: AWS_ENDPOINT
    value: "http://garage.storage.svc:3900"
  - name: AWS_DEFAULT_REGION
    value: "garage"

# 敏感密钥通过 secretKeyRef 从加密 Secret 注入
envFromSecrets: []

# Traefik IngressRoute 原生路由
ingressRoute:
  enabled: true
  host: "app.haoxiaoguai.xyz"
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  middlewares:
    - name: chain-api
      namespace: traefik

apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: apps
  labels:
    app.kubernetes.io/name: docs
    app.kubernetes.io/part-of: docs
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs
        app.kubernetes.io/part-of: docs
    spec:
      priorityClassName: platform-standard
      containers:
        - name: docs
          image: ghcr.io/woailuoisme/astro-docs
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

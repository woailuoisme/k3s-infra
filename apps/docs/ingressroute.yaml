apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: docs
  namespace: apps
  labels:
    app.kubernetes.io/name: docs
    app.kubernetes.io/part-of: docs
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`docs.mso.lol`)
      kind: Rule
      priority: 10
      middlewares:
        - name: chain-basic
          namespace: traefik
      services:
        - name: docs
          port: 80
  tls:
    certResolver: cloudflare

# ==============================================================================
# ArgoCD 4C8G 生产精简调优 Values (ArgoCD v3.0+ 官方 Helm Chart 10.x)
# ==============================================================================
# 目标：在单台 4C8G 节点上将 ArgoCD 整体内存消耗压制在 350MB-450MB (纯原生 GitOps 编排，免插件免常驻)
# ==============================================================================

global:
  domain: argocd.mso.lol

# ------------------------------------------------------------------------------
# 1. 核心控制器 (Application Controller)
# ------------------------------------------------------------------------------
controller:
  replicas: 1
  priorityClassName: edge-critical
  logFormat: json
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  metrics:
    enabled: true

# ------------------------------------------------------------------------------
# 2. 清单与配置生成服务端 (Repo Server) - 原生极简纯净模式 (由 Sealed Secrets 纳管密文)
# ------------------------------------------------------------------------------
repoServer:
  replicas: 1
  priorityClassName: edge-critical
  logFormat: json
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi


# ------------------------------------------------------------------------------
# 3. 内部缓存 Redis (单机极致精简)
# ------------------------------------------------------------------------------
redis:
  enabled: true
  priorityClassName: edge-critical
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ------------------------------------------------------------------------------
# 4. API / Web 界面服务端 (Server)
# ------------------------------------------------------------------------------
server:
  replicas: 1
  priorityClassName: edge-critical
  logFormat: json
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 150Mi
  extraArgs:
    - --insecure
  ingress:
    enabled: false

# 注入 Traefik 原生 IngressRoute (支持 Web UI 与 gRPC CLI 双通道，自动 Cloudflare 证书)
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-server
      namespace: argocd
    spec:
      entryPoints:
        - websecure
      routes:
        - match: Host(`argocd.mso.lol`)
          kind: Rule
          priority: 10
          middlewares:
            - name: chain-basic
              namespace: traefik
          services:
            - name: argocd-server
              port: 80
        - match: Host(`argocd.mso.lol`) && Headers(`Content-Type`, `application/grpc`)
          kind: Rule
          priority: 20
          services:
            - name: argocd-server
              port: 80
              scheme: h2c
      tls:
        certResolver: cloudflare

# ------------------------------------------------------------------------------
# 5. 裁剪冗余组件 (4C8G 降本节流核心)
# ------------------------------------------------------------------------------
# 禁用内置 Dex（单机环境使用内置 Admin，或直接配置 GitHub OAuth，立省 ~120MB 内存）
dex:
  enabled: false

# 禁用内置 Notifications 控制器（立省 ~80MB 内存，告警统一由 OpenObserve 或外部处理）
notifications:
  enabled: false

# 禁用 ApplicationSet 控制器（采用 App-of-Apps 模式，立省 ~100MB 内存）
applicationSet:
  enabled: false

# ------------------------------------------------------------------------------
# 6. ArgoCD v3.0+ 核心配置与细粒度 RBAC (Configs)
# ------------------------------------------------------------------------------
configs:
  cm:
    # 生产标准外网入口基准 URL (规范 Webhook 回调、OIDC 重定向与 CLI 终端交互)
    url: https://argocd.mso.lol
    # 忽略 CRD spec.preserveUnknownFields 差异，避免 3.0+ 产生无意义的 OutOfSync
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jsonPointers:
      - /spec/preserveUnknownFields
  rbac:
    # 3.0 原生严格细粒度 RBAC 策略 (Fine-Grained RBAC)
    policy.default: role:readonly
    policy.csv: |
      # 赋予 admin 角色全量应用与子资源操作权限（包括 3.0 子资源与 logs 审计）
      p, role:admin, applications, *, */*, allow
      p, role:admin, clusters, *, *, allow
      p, role:admin, repositories, *, *, allow
      p, role:admin, logs, get, */*, allow
      p, role:admin, exec, create, */*, allow
      g, admin, role:admin
    scopes: '[groups, email]'

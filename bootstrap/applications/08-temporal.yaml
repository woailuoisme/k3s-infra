apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 08-temporal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/woailuoisme/k3s-infra.git
    targetRevision: main
    path: platform/workflows/temporal
  destination:
    server: https://kubernetes.default.svc
    namespace: workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

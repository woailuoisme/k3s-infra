apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 06-meilisearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://meilisearch.github.io/meilisearch-kubernetes
      chart: meilisearch
      targetRevision: 0.13.0
      helm:
        releaseName: meilisearch
        valueFiles:
          - $values/platform/search/meilisearch/meilisearch-values.yaml
    - repoURL: https://github.com/woailuoisme/k3s-infra.git
      targetRevision: main
      path: platform/search/meilisearch
    - repoURL: https://github.com/woailuoisme/k3s-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: search
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

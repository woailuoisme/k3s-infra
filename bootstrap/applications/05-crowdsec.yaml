apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 05-crowdsec
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/woailuoisme/k3s-infra.git
    targetRevision: main
    path: platform/security/crowdsec
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

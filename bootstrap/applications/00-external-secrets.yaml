apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 00-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # 1. 官方 External Secrets Operator Helm Chart 仓库
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.12.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/platform/security/external-secrets/values.yaml
    # 2. 本 GitOps 仓库 (提供 ClusterSecretStore 声明)
    - repoURL: https://github.com/woailuoisme/k3s-infra.git
      targetRevision: main
      path: platform/security/external-secrets
    # 3. 本 GitOps 仓库 (提供本地 values.yaml)
    - repoURL: https://github.com/woailuoisme/k3s-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

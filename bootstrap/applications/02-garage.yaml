apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 02-garage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # 1. Garage 社区 Helm Chart (Git 仓库源，锁定 garage-2.4.2 标签)
    - repoURL: https://github.com/wittdennis/charts.git
      targetRevision: garage-2.4.2
      path: garage
      helm:
        releaseName: garage
        valueFiles:
          - $values/platform/storage/garage/values.yaml
    # 2. 本 GitOps 仓库 (提供 WebUI, Traefik IngressRoute 与 ExternalSecret)
    - repoURL: https://github.com/woailuoisme/k3s-infra.git
      targetRevision: main
      path: platform/storage/garage
    # 3. 本 GitOps 仓库 (提供本地 values.yaml)
    - repoURL: https://github.com/woailuoisme/k3s-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

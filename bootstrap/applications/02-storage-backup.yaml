apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 02-storage-backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/woailuoisme/k3s-infra.git
    targetRevision: main
    path: platform/storage/backup
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 05-authelia
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.authelia.com
      chart: authelia
      targetRevision: 0.9.3
      helm:
        releaseName: authelia
        valueFiles:
          - $values/platform/security/authelia/authelia-values.yaml
    - repoURL: https://github.com/seaside/infra.git
      targetRevision: main
      path: platform/security/authelia
    - repoURL: https://github.com/seaside/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

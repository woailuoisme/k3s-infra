# ==============================================================================
# Traefik v3 业务路由模板示例 (Apps Dynamic Route Template)
# ==============================================================================
# 提示: Traefik 的 File 提供者原生支持 Go 模板语法。
# 您可以直接在配置文件中使用 {{ env "SITE_ADDRESS" }} 引用环境变量，
# 在不同环境（如本地 test.local、开发 dev.example.com）下自动适配无缝切换。
# 中间件推荐直接引用 dynamic/middlewares.yml 定义的标准链路：
#   - chain-basic@file    : 基础安全 + 压缩 + 防 502 重试 (对应 Caddy proxy-app)
#   - chain-auth@file     : 基础安全 + Authelia 单点登录拦截 (对应 Caddy proxy-app-auth)
#   - chain-api@file      : 基础安全 + 频率限制 + CORS 跨域头
#   - chain-internal@file : 基础安全 + 限制仅内网/白名单 IP 访问
# ==============================================================================

# http:
#   routers:
#     # --- 1. 标准公开应用 (对应 Caddy proxy-app) ---
#     example-app:
#       rule: 'Host(`example.{{ env "SITE_ADDRESS" }}`)'
#       entryPoints:
#         - websecure
#       service: example-app-service
#       tls: {}
#       middlewares:
#         - chain-basic@file
#
#     # --- 2. 需 Authelia 统一身份鉴权的应用 (对应 Caddy proxy-app-auth) ---

# Centrifugo v6.9 统一生产级最佳实践配置
# 参考: https://centrifugal.dev/docs/server/configuration

# ============================================
# 1. 传输协议配置 (Transports)
# ============================================
websocket:
  use_write_buffer_pool: true
  message_size_limit: 65536  # 64KB 防恶意外包/DoS 上行大小限制

uni_websocket:
  enabled: true

http_stream:
  enabled: true

sse:
  enabled: true

uni_sse:
  enabled: true

# ============================================
# 2. 消息引擎配置 (Engine - Valkey / Redis)
# ============================================
# v6 默认基于 Rueidis 客户端建立高性能连接复用
# 引擎类型与连接地址通过环境变量动态配置（支持 Standalone / Sentinel / Cluster 拓扑）
engine:
  type: redis
  redis:
    # 具体的连接地址通过环境变量 CENTRIFUGO_ENGINE_REDIS_ADDRESS 动态注入
    # 示例: redis://:password@valkey:6379/2 (单实例) 或 redis+sentinel://... (哨兵)
    connect_timeout: "1s"
    io_timeout: "4s"

# ============================================
# 3. 客户端长连接与安全控制 (Client Options)
# ============================================
client:
  # 默认禁止匿名连接，安全至上；开发环境可通过环境变量重写为 true
  allow_anonymous_connect_without_token: false
  
  # 跨域列表默认由环境变量 CENTRIFUGO_CLIENT_ALLOWED_ORIGINS 覆盖
  allowed_origins: []

  # 长连接心跳控制
  ping_interval: 30s
  pong_timeout: 8s
  
  # 资源与并发防护
  connection_limit: 10000
  user_connection_limit: 10
  queue_max_size: 1048576  # 1MB 客户端单连接发送缓冲区上限
  stale_close_delay: "10s"

# ============================================
# 4. 管理后台与监控 (Admin & Observability)
# ============================================
admin:
  enabled: true
  handler_prefix: "/admin"

health:
  enabled: true

prometheus:
  enabled: true

# ============================================
# 5. 系统日志配置 (Logging)
# ============================================
log:
  level: info  # 可由环境变量 CENTRIFUGO_LOG_LEVEL 动态覆盖

# ============================================
# 6. 通道命名空间配置 (Channel Namespaces)
# ============================================
channel:
  # Redis 中历史记录元数据的保留时长 (30 天)
  history_meta_ttl: "720h"
  
  namespaces:
    # ----------------------------------------------------
    # public 公开命名空间：主要用于公共大厅、广播频道等场景。
    # 启用 allow_recovery 与 force_recovery 保证弱网重连自动补发未读消息。
    # 禁用客户端直接发布，所有消息必须通过后端 API 统一校验和下发。
    # ----------------------------------------------------
    - name: public
      presence: true
      join_leave: true
      history_size: 100
      history_ttl: "300s"
      allow_recovery: true
      force_recovery: true
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: true
      allow_subscribe_for_anonymous: false
      allow_publish_for_anonymous: false
    
    # ----------------------------------------------------
    # private 私有命名空间：用于点对点通信、系统敏感业务频道。
    # 必须持后端签发的订阅 Token 才能订阅，禁用客户端直接 publish。
    # ----------------------------------------------------
    - name: private
      presence: true
      join_leave: true
      history_size: 50
      history_ttl: "300s"
      allow_recovery: true
      force_recovery: true
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: false
    
    # ----------------------------------------------------
    # user 用户个人频道命名空间：用于向特定用户推送个人通知/消息。
    # 禁用 presence 与 join_leave 以极大地节省 Redis 内存与网络开销。
    # ----------------------------------------------------
    - name: user
      presence: false
      join_leave: false
      history_size: 50
      history_ttl: "300s"
      allow_recovery: true
      force_recovery: true
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: false
    
    # ----------------------------------------------------
    # notification 实时通知命名空间：用于高吞吐量、时效性强的 Toast/消息提醒。
    # 不启用历史恢复 (allow_recovery: false) 并保持小 history，降低 Valkey 压力。
    # ----------------------------------------------------
    - name: notification
      presence: false
      join_leave: false
      history_size: 10
      history_ttl: "60s"
      allow_recovery: false
      force_recovery: false
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: true

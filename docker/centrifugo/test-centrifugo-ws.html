<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrifugo v6 WebSocket 测试</title>
    
    <!-- 引入 Google 字体 (Inter + JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- 引入 Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- 针对 Tailwind CSS v4 Play CDN 的自定义配置 -->
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        
        /* 自定义滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>

    <!-- 引入 Centrifuge v5.2.2 & AlpineJS v3 -->
    <script src="https://cdn.jsdelivr.net/npm/centrifuge@5.2.2/dist/centrifuge.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen py-12 px-4 sm:px-6 lg:px-8" x-data="centrifugoTest">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <!-- 头部标题栏 -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-800">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent flex items-center gap-3">
                    🚀 Centrifugo v6 测试面板
                </h1>
                <p class="text-slate-400 text-sm mt-1">实时 WebSocket 连接分析与订阅数据流探测工具</p>
            </div>
            
            <!-- 状态指示徽章 -->
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400 font-medium">当前状态:</span>
                <template x-if="status === 'connected'">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 shadow-[0_0_15px_rgba(16,185,129,0.1)]">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                        已连接
                    </span>
                </template>
                <template x-if="status === 'connecting'">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 animate-pulse">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                        正在连接
                    </span>
                </template>
                <template x-if="status === 'disconnected'">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
                        已断开
                    </span>
                </template>
                <template x-if="status === 'error'">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20">
                        <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
                        连接错误
                    </span>
                </template>
            </div>
        </div>

        <!-- 栅格系统 (左侧控制，右侧控制台) -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
            
            <!-- 左侧：参数配置与状态信息 -->
            <div class="md:col-span-5 space-y-6">
                
                <!-- 配置面板 -->
                <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-md space-y-4">
                    <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
                        ⚙️ 连接配置
                    </h2>
                    
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">WebSocket 端点地址</label>
                            <input type="text" x-model="wsUrl" :disabled="status === 'connected' || status === 'connecting'"
                                class="w-full px-3.5 py-2 bg-slate-950/60 border border-slate-800 rounded-xl font-mono text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed transition">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">订阅频道名称</label>
                            <input type="text" x-model="channel" :disabled="status === 'connected' || status === 'connecting'"
                                class="w-full px-3.5 py-2 bg-slate-950/60 border border-slate-800 rounded-xl font-mono text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <button @click="connect()" :disabled="status === 'connected' || status === 'connecting'"
                            class="py-2.5 px-4 rounded-xl font-medium text-sm text-white bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] disabled:opacity-30 disabled:hover:bg-emerald-600 disabled:active:scale-100 cursor-pointer disabled:cursor-not-allowed transition duration-150 ease-in-out shadow-lg shadow-emerald-950/20">
                            连接服务
                        </button>
                        <button @click="disconnect()" :disabled="status !== 'connected' && status !== 'connecting'"
                            class="py-2.5 px-4 rounded-xl font-medium text-sm text-slate-200 bg-slate-800 hover:bg-slate-700 active:scale-[0.98] disabled:opacity-30 disabled:hover:bg-slate-800 disabled:active:scale-100 cursor-pointer disabled:cursor-not-allowed transition duration-150 ease-in-out">
                            断开连接
                        </button>
                    </div>
                </div>

                <!-- 信息卡片 -->
                <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-md space-y-4">
                    <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
                        📊 运行时信息
                    </h2>
                    
                    <div class="divide-y divide-slate-800/50 text-xs">
                        <div class="py-2.5 flex justify-between">
                            <span class="text-slate-400">客户端库版本:</span>
                            <span class="font-mono text-slate-200">Centrifuge v5.2.2</span>
                        </div>
                        <div class="py-2.5 flex justify-between">
                            <span class="text-slate-400">目标协议版本:</span>
                            <span class="text-emerald-400 font-semibold">Centrifugo v6</span>
                        </div>
                        <div class="py-2.5 flex flex-col gap-1">
                            <span class="text-slate-400">状态详情:</span>
                            <span class="font-mono text-slate-300 break-all bg-slate-950/60 p-2 rounded-lg border border-slate-800/50 mt-1" x-text="statusText"></span>
                        </div>
                        <template x-if="clientId">
                            <div class="py-2.5 flex flex-col gap-1">
                                <span class="text-slate-400">Client ID (连接标识):</span>
                                <span class="font-mono text-teal-400 bg-teal-950/10 border border-teal-900/30 p-2 rounded-lg mt-1 break-all" x-text="clientId"></span>
                            </div>
                        </template>
                    </div>
                </div>

            </div>

            <!-- 右侧：实时日志控制台 -->
            <div class="md:col-span-7">
                <div class="flex flex-col h-[550px] bg-slate-900/40 border border-slate-800/80 rounded-2xl shadow-xl overflow-hidden backdrop-blur-md">
                    
                    <!-- 终端控制头部 -->
                    <div class="flex justify-between items-center px-5 py-3.5 border-b border-slate-800/60 bg-slate-950/30">
                        <div class="flex items-center gap-3">
                            <!-- macOS 样式三色小圆点 -->
                            <div class="flex gap-1.5">
                                <span class="w-3.5 h-3.5 rounded-full bg-rose-500/80"></span>
                                <span class="w-3.5 h-3.5 rounded-full bg-amber-500/80"></span>
                                <span class="w-3.5 h-3.5 rounded-full bg-emerald-500/80"></span>
                            </div>
                            <span class="text-xs font-semibold text-slate-300 tracking-wide">终端实时数据日志</span>
                        </div>
                        
                        <button @click="clearLogs()" class="px-3 py-1.5 text-xs font-semibold text-slate-300 bg-slate-800/60 hover:bg-slate-700 hover:text-white rounded-lg border border-slate-700/50 transition cursor-pointer">
                            清空记录
                        </button>
                    </div>

                    <!-- 终端输出视图 -->
                    <div id="log-container" class="flex-1 overflow-y-auto p-5 font-mono text-[11px] leading-relaxed space-y-2.5 bg-black/40">
                        <template x-for="(item, idx) in logs" :key="idx">
                            <div class="flex items-start gap-2 py-1 px-2 border-l-2 rounded-r transition duration-150"
                                 :class="{
                                     'border-slate-700 text-slate-400 hover:bg-slate-950/20': item.type === 'info',
                                     'border-emerald-500 text-emerald-300 bg-emerald-950/10 hover:bg-emerald-950/20': item.type === 'success',
                                     'border-rose-500 text-rose-300 bg-rose-950/10 hover:bg-rose-950/20': item.type === 'error'
                                 }">
                                <span class="text-slate-600 select-none shrink-0" x-text="`[${item.timestamp}]`"></span>
                                <span class="break-all" x-text="item.message"></span>
                            </div>
                        </template>
                        
                        <!-- 缺省提示 -->
                        <template x-if="logs.length === 0">
                            <div class="h-full flex flex-col items-center justify-center text-slate-600 gap-2">
                                <span class="text-3xl">💻</span>
                                <span class="text-xs select-none">控制台暂无数据，连接后将实时滚动显示...</span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

        </div>

        <!-- 底部版权栏 -->
        <div class="text-center text-xs text-slate-600 pt-4">
            Centrifugo v6 WebSocket Prober • Designed with Tailwind CSS v4 & Alpine.js
        </div>

    </div>

    <!-- AlpineJS 组件业务逻辑 -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('centrifugoTest', () => ({
                wsUrl: 'wss://push.test.local/connection/websocket',
                channel: 'public:test',
                status: 'disconnected',
                statusText: '准备就绪',
                clientId: '',
                logs: [],
                centrifuge: null,

                init() {
                    this.log('页面初始化完成，准备进行 Centrifugo v6 WebSocket 连接测试', 'info');
                    if (typeof Centrifuge === 'undefined') {
                        this.log('✗ Centrifuge 库未加载，请检查网络连接或 CDN 可用性', 'error');
                        this.status = 'error';
                        this.statusText = '✗ 库加载失败';
                    } else {
                        this.log(`✓ Centrifuge 库加载完成 (版本: ${Centrifuge.version || 'v5'})`, 'success');
                        this.log('请在左侧配置面板中检查参数，随后点击"连接服务"开始探针测试', 'info');
                    }
                },

                log(message, type = 'info') {
                    const timestamp = new Date().toLocaleTimeString();
                    this.logs.push({
                        timestamp,
                        message,
                        type // 'info', 'success', 'error'
                    });
                    
                    // 等待 DOM 更新后自动滚动日志区域
                    this.$nextTick(() => {
                        const logContainer = document.getElementById('log-container');
                        if (logContainer) {
                            logContainer.scrollTop = logContainer.scrollHeight;
                        }
                    });
                },

                connect() {
                    if (this.centrifuge) {
                        this.disconnect();
                    }
                    try {
                        this.log(`准备发起连接到: ${this.wsUrl}`, 'info');
                        
                        if (typeof Centrifuge === 'undefined') {
                            this.log('✗ Centrifuge 库未就绪，连接终止', 'error');
                            this.status = 'error';
                            this.statusText = '库加载失败';
                            return;
                        }
                        
                        // v6 使用匿名连接并传入端点
                        this.centrifuge = new Centrifuge(this.wsUrl, {
                            debug: true
                        });

                        // 注册核心连接事件处理器
                        this.centrifuge.on('connecting', (ctx) => {
                            this.status = 'connecting';
                            this.statusText = `连接中... (代码: ${ctx.code || '无'}, 原因: ${ctx.reason || '无'})`;
                            this.log(`正在建立连接... (code: ${ctx.code || 'N/A'}, reason: ${ctx.reason || 'N/A'})`, 'info');
                        });

                        this.centrifuge.on('connected', (ctx) => {
                            this.status = 'connected';
                            this.statusText = `连接已建立 (Client ID: ${ctx.client})`;
                            this.clientId = ctx.client;
                            this.log(`✓ 握手成功！客户端 ID: ${ctx.client}`, 'success');
                            this.subscribeToChannel();
                        });

                        this.centrifuge.on('disconnected', (ctx) => {
                            this.status = 'disconnected';
                            this.statusText = `已断开连接 (代码: ${ctx.code || '无'}, 原因: ${ctx.reason || '无'})`;
                            this.log(`已断开连接 (code: ${ctx.code || 'N/A'}, reason: ${ctx.reason || 'N/A'})`, 'info');
                            this.clientId = '';
                            this.centrifuge = null;
                        });

                        this.centrifuge.on('error', (ctx) => {
                            const errorMsg = ctx.error?.message || ctx.message || JSON.stringify(ctx);
                            this.status = 'error';
                            this.statusText = `连接遇到错误: ${errorMsg}`;
                            this.log(`✗ 连接错误: ${errorMsg}`, 'error');
                        });

                        // 执行连接
                        this.centrifuge.connect();
                    } catch (error) {
                        this.status = 'error';
                        this.statusText = `初始化连接失败: ${error.message}`;
                        this.log(`✗ 连接启动异常: ${error.message}`, 'error');
                    }
                },

                disconnect() {
                    if (this.centrifuge) {
                        this.log('正在执行手动断开...', 'info');
                        this.centrifuge.disconnect();
                        this.centrifuge = null;
                    }
                },

                subscribeToChannel() {
                    if (!this.centrifuge) return;
                    try {
                        this.log(`开始订阅目标频道: ${this.channel}`, 'info');
                        const sub = this.centrifuge.newSubscription(this.channel);

                        sub.on('publication', (ctx) => {
                            this.log(`[${this.channel}] 接收到广播数据: ${JSON.stringify(ctx.data)}`, 'success');
                        });

                        sub.on('subscribing', (ctx) => {
                            this.log(`正在进行频道订阅... (code: ${ctx.code || 'N/A'}, reason: ${ctx.reason || 'N/A'})`, 'info');
                        });

                        sub.on('subscribed', (ctx) => {
                            this.log(`✓ 订阅频道 [${this.channel}] 成功！`, 'success');
                        });

                        sub.on('unsubscribed', (ctx) => {
                            this.log(`已取消订阅频道 [${this.channel}] (code: ${ctx.code || 'N/A'}, reason: ${ctx.reason || 'N/A'})`, 'info');
                        });

                        sub.on('error', (ctx) => {
                            const errorMsg = ctx.error?.message || ctx.message || JSON.stringify(ctx);
                            this.log(`✗ 频道订阅错误: ${errorMsg}`, 'error');
                        });

                        sub.subscribe();
                    } catch (error) {
                        this.log(`✗ 执行订阅逻辑抛出异常: ${error.message}`, 'error');
                    }
                },

                clearLogs() {
                    this.logs = [];
                }
            }));
        });
    </script>
</body>
</html>

# OTel Collector 网关最佳实践：内存保护 → 资源富化 → 批处理 → 带重试排队导出
extensions:
  # 健康探针（容器内 http://localhost:13133）
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # 统一摄取入口：gRPC 4317（多数 SDK/Agent 默认）+ HTTP 4318（浏览器/受限环境）
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 【必须放第一位】背压保护：先限内存再谈其他，防止后端抖动打爆网关
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 128

  # 资源富化：自动补 host.name/os.type 等维度，无此字段时查询端无法按主机过滤
  resource_detection:
    detectors: [env, system]
    timeout: 2s

  # 批处理：降低对 OpenObserve 的写入请求频率（5s 或攒满 1024 条先到先发）
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp_http/openobserve:
    # OpenObserve OTLP 约定：/api/<组织名>，导出时自动追加 /v1/traces|metrics|logs
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: ${env:O2_AUTH}
      # 物理流名（相当于数据表名，非微服务名）：各应用统一存入 default 流，看板中按各自的 service_name 字段过滤区分
      stream-name: default
    # 【关键】发送队列 + 重试：OpenObserve 重启/抖动期间数据本地排队，不丢
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    # 自身指标（排队/丢弃/批处理水位），供 vmagent 内网抓取 :8888
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_http/openobserve]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_http/openobserve]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_http/openobserve]

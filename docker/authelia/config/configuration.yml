# ==============================================================================
# Authelia 4.39 生产与开发最佳实践配置文件
# 官方参考文档: https://www.authelia.com/configuration/prologue/introduction/
# ==============================================================================

# 界面主题: light, dark, grey, auto
theme: dark

# 身份验证重置密码 JWT 密钥 (通过环境变量注入)
identity_validation:
  reset_password:
    jwt_secret: '{{ env "JWT_SECRET" }}'

# ==============================================================================
# 服务器与网关集成端点配置
# ==============================================================================
server:
  address: "tcp://0.0.0.0:9091"
  buffers:
    read: 8192
    write: 8192
  endpoints:
    authz:
      auth-request:
        implementation: "AuthRequest"
      forward-auth:
        implementation: "ForwardAuth"
      ext-authz:
        implementation: "ExtAuthz"
      legacy:
        implementation: "Legacy"

# ==============================================================================
# 日志配置
# ==============================================================================
log:
  level: info
  format: json

# ==============================================================================
# 双因子认证: TOTP (动态口令) 与 WebAuthn / Passkeys (安全密钥/通行密钥)
# ==============================================================================
totp:
  issuer: '{{ env "DOMAIN" }}'
  algorithm: sha1
  period: 30
  digits: 6

webauthn:
  disable: false
  display_name: 'Authelia'
  enable_passkey_login: true
  timeout: "60 seconds"

# ==============================================================================
# 认证用户源配置 (文件后端，开启热监听)
# ==============================================================================
authentication_backend:
  file:
    path: /config/users_database.yml
    watch: true
    search:
      email: true
      case_insensitive: true

# ==============================================================================
# 密码策略配置
# ==============================================================================
password_policy:
  standard:
    enabled: true
    min_length: 8
    max_length: 0
    require_uppercase: true
    require_number: true
    require_special: true

# ==============================================================================
# 访问控制规则 (Access Control Rules)
# ==============================================================================
access_control:
  default_policy: deny
  rules:
    # 认证中心自身路由放行
    - domain:
        - 'auth.{{ env "DOMAIN" }}'
      policy: "bypass"

    # 开发环境特定路由访问控制
    - domain:
        - 'dev.{{ env "DOMAIN" }}'
      resources:
        - "^/docs(/.*)?$"
      policy: "one_factor"
      subject:
        - "group:user"
    - domain:
        - 'dev.{{ env "DOMAIN" }}'
      resources:
        - "^/horizon(/.*)?$"
        - "^/log-viewer(/.*)?$"
      policy: "one_factor"
      subject:
        - "group:admin"

    # API 文档与看板控制
    - domain:
        - 'rest.{{ env "DOMAIN" }}'
      resources:
        - "^/docs(/.*)?$"
      policy: "one_factor"
      subject:
        - "group:user"
    - domain:
        - 'rest.{{ env "DOMAIN" }}'
      resources:
        - "^/horizon(/.*)?$"
        - "^/log-viewer(/.*)?$"
      policy: "one_factor"
      subject:
        - "group:admin"

    # 默认顶级域与所有子域管理员权限保护
    - domain:
        - '{{ env "DOMAIN" }}'
        - '*.{{ env "DOMAIN" }}'
      policy: "one_factor"
      subject:
        - "group:admin"

# ==============================================================================
# 会话与 Cookie 配置 (对接 Redis 集中缓存)
# ==============================================================================
session:
  secret: '{{ env "SESSION_SECRET" }}'
  name: "authelia_session"
  inactivity: "60m"
  expiration: "3h"
  remember_me: "1M"
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "DOMAIN" }}'
      default_redirection_url: 'https://{{ env "DOMAIN" }}'
      same_site: "lax"
  redis:
    host: '{{ env "REDIS_HOST" }}'
    port: {{ env "REDIS_PORT" }}
    database_index: 0
    {{- if env "REDIS_PASSWORD" }}
    password: '{{ env "REDIS_PASSWORD" }}'
    {{- end }}

# ==============================================================================
# 防爆破安全规则配置
# ==============================================================================
regulation:
  max_retries: 3
  find_time: "2m"
  ban_time: "5m"

# ==============================================================================
# 持久化存储配置 (分离至专属数据卷 /data/db.sqlite3)
# ==============================================================================
storage:
  encryption_key: '{{ env "STORAGE_ENCRYPTION_KEY" }}'
  local:
    path: /data/db.sqlite3

# ==============================================================================
# 邮件发信服务配置 (用于 2FA 绑定与密码重置)
# ==============================================================================
notifier:
  disable_startup_check: true
  smtp:
    address: "submission://smtp.resend.com:587"
    username: '{{ env "RESEND_USER_NAME" }}'
    password: '{{ env "RESEND_API_KEY" }}'
    sender: "support@jso.lol"
    identifier: '{{ env "DOMAIN" }}'
    subject: "[Authelia] {title}"

# ==============================================================================
# NTP 时间同步校准
# ==============================================================================
ntp:
  address: "udp://time.cloudflare.com:123"
  version: 4
  max_desync: "3 seconds"
  disable_startup_check: false
  disable_failure: false

# ==============================================================================
# Prometheus 监控指标配置 (供 vmagent 内部抓取)
# ==============================================================================
telemetry:
  metrics:
    enabled: true
    address: "tcp://0.0.0.0:9959"


services:
  postgres:
    container_name: postgres
    build:
      context: .
    restart: always
    # 共享内存：预留给 shared_buffers (256MB) 与并行查询/超表动态共享内存段 (DSM)
    shm_size: 512mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TIMEZONE:-Asia/Shanghai}
      # TimescaleDB 目标库列表（空格分隔，按需声明以节省 background worker 槽位）
      - TIMESCALE_DATABASES=${TIMESCALE_DATABASES:-lunchbox}
      # IoT 售货机业务 Schema 初始化开关 (默认 false)
      - ENABLE_IOT_VENDING_SCHEMA=${ENABLE_IOT_VENDING_SCHEMA:-false}
      # PgBouncer auth_query 认证角色引导密码 (须与 pgbouncer 服务一致)
      - PGBOUNCER_AUTH_PASSWORD=${PGBOUNCER_AUTH_PASSWORD}
    volumes:
      - ${DATA_PATH}postgres18:/var/lib/postgresql
      - ${CONFIG_PATH}database/postgres-18/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ${CONFIG_PATH}database/postgres-18/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-postgres} -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - backend

# ==============================================================================
# PostgreSQL 18 配置 (针对 2核/1GB 内存微规格实例调优)
# ==============================================================================

# --- 1. 连接与进程池 ---
listen_addresses = '*'
port = 5432
max_connections = 50                    # 单机防内存耗尽，高并发需求应接入 pgbouncer
superuser_reserved_connections = 3      # 为管理员维护预留连接
max_worker_processes = 24               # 后台工作进程总池：覆盖 TimescaleDB 探测(16) + pg_cron + 并行查询

# --- 2. 预加载扩展与扩展特化参数 ---
shared_preload_libraries = 'timescaledb,pg_cron,pg_stat_statements'
cron.database_name = 'postgres'          # pg_cron 运行的主库
cron.timezone = 'Asia/Shanghai'

# pg_stat_statements
pg_stat_statements.track = all           # 跟踪所有语句（含嵌套调用）
pg_stat_statements.max = 10000           # 历史语句追踪最大条数
pg_stat_statements.track_utility = on

# TimescaleDB
timescaledb.max_background_workers = 16 # 启动探测与多库调度 worker 上限
timescaledb.telemetry_level = off       # 关闭上报遥测
timescaledb.license = 'apache'          # 使用 Apache 开源许可版本

# --- 3. 内存与缓存配置 (基准: 1GB 宿主内存) ---
shared_buffers = 256MB                  # 约占总内存 25%
effective_cache_size = 768MB            # 规划 OS + PG 可用缓存，约占 75%
work_mem = 2MB                          # 单查询排序与哈希操作内存
maintenance_work_mem = 128MB            # 加速 VACUUM 及向量/空间/分区索引构建
temp_buffers = 8MB

# --- 4. WAL 与检查点 ---
wal_level = replica                     # 支撑流复制与基础备份
max_wal_senders = 2
wal_buffers = 4MB
wal_compression = lz4                   # lz4 极低 CPU 开销压缩 WAL，显著缩减磁盘 I/O
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_timeout = 10min

# --- 5. 存储与 I/O 成本模型 (针对 SSD/云盘优化) ---
random_page_cost = 1.1                  # 贴近顺序读代价，促使规划器积极使用索引
effective_io_concurrency = 150          # SSD 并发预读能力

# --- 6. 并行查询 (匹配双核 CPU) ---
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
enable_parallel_append = on
enable_parallel_hash = on
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
enable_partition_pruning = on

# --- 7. 自动清理 (Autovacuum) ---
autovacuum_max_workers = 2
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.1    # 10% 死元组即触发 VACUUM，防止表膨胀
autovacuum_analyze_scale_factor = 0.05
autovacuum_work_mem = 32MB
log_autovacuum_min_duration = 2000      # 记录耗时超 2 秒的清理过程

# --- 8. 日志系统 ---
log_destination = 'stderr'
logging_collector = off                 # 关闭内置文件写入，统一交由容器标准输出收集
log_min_messages = error
log_min_duration_statement = 1000       # 慢查询记录阈值 (毫秒)
log_connections = off
log_disconnections = off
log_line_prefix = '%t [%p]: '
log_checkpoints = off
log_timezone = 'Asia/Shanghai'
log_hostname = off
log_statement = 'none'
log_recovery_conflict_waits = off

# --- 9. 连接行为与超时保护 ---
statement_timeout = 60000               # 60 秒单语句超时，阻断慢查询堆积
lock_timeout = 30000                    # 30 秒锁等待超时
idle_in_transaction_session_timeout = 120000 # 2 分钟事务内空闲超时
timezone = 'Asia/Shanghai'
extra_float_digits = 0
max_locks_per_transaction = 64          # 支撑 TimescaleDB 多 chunk 事务锁
jit = off                               # 2核微型规格禁用 JIT 以节省 CPU 与内存开销
track_io_timing = off
default_statistics_target = 100

# --- 10. 后台写入与 TCP 保活 ---
bgwriter_delay = 50ms
bgwriter_lru_maxpages = 200
bgwriter_lru_multiplier = 3.0
tcp_keepalives_idle = 120
tcp_keepalives_interval = 30
tcp_keepalives_count = 3

# Valkey 9.1 配置 — 低配精简版 (2核1G / 队列主导)
# 原则：noeviction 保护队列数据 · AOF everysec 保底 · 内存严格封顶

################################## 网络配置 #####################################
bind 0.0.0.0
port 6379
protected-mode yes
# TCP 保活探测，清理死连接
tcp-keepalive 300

################################# 身份验证 #####################################
# requirepass 由 docker-entrypoint.sh 通过 VALKEY_PASSWORD 环境变量动态注入

################################## 内存管理 #####################################
# 最大内存限制（容器层另有 mem_limit 双保险）
maxmemory 256mb
# 淘汰策略：noeviction 保护 BullMQ/Laravel Queue 数据，内存满时拒绝写入而非淘汰
maxmemory-policy noeviction

# Lazy Free (延迟释放): 大对象删除移至后台线程，避免主线程卡顿 (低配更需要)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# 容器化优化
# 调整 OOM 分数，提高容器在内存紧张时的稳定性
oom-score-adj yes
# 启用 jemalloc 后台线程，优化内存分配效率
jemalloc-bg-thread yes

################################ 快照持久化 ################################
# RDB 快照作为快速恢复基线（与 AOF 混合持久化配合）
save 900 1
save 300 100
save 60 10000

################################ AOF 持久化 ###############################
# 队列数据不可丢，开启 AOF
appendonly yes
# 每秒同步，崩溃最多丢 1 秒；重写期间照常 fsync (no-appendfsync-on-rewrite 保持默认 no)
appendfsync everysec
# 混合持久化: RDB 加载速度 + AOF 增量安全性
aof-use-rdb-preamble yes
# AOF 文件增长一倍且超过 64mb 时触发重写
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

################################## 限制与日志 ##################################
# 最大并发客户端连接数（低配封顶，防止连接风暴吃光内存）
maxclients 1000
loglevel notice
# BullMQ/Laravel 默认只用 db0，留 2 个备用
databases 2

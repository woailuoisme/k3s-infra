services:
  pgbackups:
    image: prodrigestivill/postgres-backup-local:18-alpine
    container_name: pgbackups
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DATA_PATH}pgbackups:/backups
    environment:
      # 数据库连接凭证 (来自根 .env)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TIMEZONE:-Asia/Shanghai}
      # 转储优化：-Z1 快速压缩、导出大对象与 public 模式
      - POSTGRES_EXTRA_OPTS=-Z1 --schema=public --blobs
      # 调度策略：每日凌晨 03:00 自动快照，容器初次启动时立即跑一次验真
      - SCHEDULE=0 3 * * *
      - BACKUP_ON_START=TRUE
      # 多层轮转归档保留策略：滚动清理过期备份
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      # 监控探针：内置微服务端口 (Uptime Kuma 直探 http://pgbackups:8080，超期/失败返回 500)
      - HEALTHCHECK_PORT=8080
    networks:
      - backend

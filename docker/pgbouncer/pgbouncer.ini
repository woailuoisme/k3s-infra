;;; PgBouncer 配置 - 事务池化，面向 Laravel Octane / RoadRunner
;;; 设计契约与运维动作见同目录 README.md
;;;
;;; 预算约束：Postgres max_connections = 50（database/postgres-18/postgresql.conf）
;;;           本文件的池化预算之和必须严格小于该值，为直连消费者与余量留出空间。

[databases]
;;; 显式列库：不使用通配 *，每个库必须显式给出 pool_size。
;;; 合计 30 条后端连接，常态由 min_pool_size 保持 10 条。
;;; 注意：此处不得出现 password= —— 官方明确 auth_query 与显式 password 不兼容。
lunchbox = host=postgres port=5432 dbname=lunchbox pool_size=12
zitadel = host=postgres port=5432 dbname=zitadel pool_size=6
chatwoot = host=postgres port=5432 dbname=chatwoot pool_size=6
casdoor = host=postgres port=5432 dbname=casdoor pool_size=4
postgres = host=postgres port=5432 dbname=postgres pool_size=2

[pgbouncer]

;;; ---------------------------------------------------------------------------
;;; 监听
;;; ---------------------------------------------------------------------------
listen_addr = 0.0.0.0
listen_port = 15432
unix_socket_dir = /var/run/pgbouncer

;;; ---------------------------------------------------------------------------
;;; 认证
;;; userlist.txt 只保留 auth_user 一行（引导凭据），其余用户由 auth_query
;;; 在 Postgres 侧动态解析 —— 业务密码轮换无需重启本服务。
;;; auth_dbname 把认证固定到 postgres 库：auth_query 官方语义是在「目标库」内
;;; 执行，不设它则 SECURITY DEFINER 函数必须装进每一个客户端会连的库。
;;; ---------------------------------------------------------------------------
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_dbname = postgres
auth_query = SELECT usename, passwd FROM pgbouncer_auth_lookup($1)

;;; ---------------------------------------------------------------------------
;;; 池化模式
;;; default_pool_size 故意不设置：5 个库条目都已显式给出 pool_size，上游默认值
;;; 不会生效。新增库时必须在 [databases] 中显式声明 pool_size。
;;; max_prepared_statements 必须显式非零，否则事务模式下协议级预处理不可用。
;;; ---------------------------------------------------------------------------
pool_mode = transaction
max_client_conn = 200
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 5
max_user_connections = 30
max_prepared_statements = 200

;;; ---------------------------------------------------------------------------
;;; 超时（秒）
;;; query_wait_timeout 对齐 Postgres 的 statement_timeout (60s)：
;;; 排队等待不应比语句执行本身更晚失败。
;;; ---------------------------------------------------------------------------
server_connect_timeout = 15
query_wait_timeout = 60
client_idle_timeout = 0
server_idle_timeout = 600
server_lifetime = 3600

;;; ---------------------------------------------------------------------------
;;; 连接健康
;;; server_reset_query 故意不设置：事务模式下它永不执行，写 DISCARD ALL 只会
;;; 造成「会话状态已被清理」的错误安全感。会话级特性由应用侧契约禁止，见 README。
;;; ---------------------------------------------------------------------------
server_check_query = SELECT 1

;;; ---------------------------------------------------------------------------
;;; 管理入口
;;; admin_users 中的用户必须能在 Postgres 侧通过认证（走 auth_query）。
;;; ---------------------------------------------------------------------------
admin_users = postgres
application_name_add_host = 1

;;; ---------------------------------------------------------------------------
;;; 日志：只走 stderr，由 Docker 日志驱动统一采集。
;;; 不设 logfile —— 官方语义下 logfile 不会关闭 stderr，等于双写，且容器内文件
;;; 重建即丢。
;;; ---------------------------------------------------------------------------
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
pidfile = /var/run/pgbouncer/pgbouncer.pid

;;; ---------------------------------------------------------------------------
;;; 客户端启动参数
;;; PgBouncer 对启动包里的参数（含 options 内部的 -c 参数）**逐项**判定：
;;;   1) 可跟踪集合内 → 接受并实际生效。默认为 client_encoding / datestyle /
;;;      timezone / standard_conforming_strings，外加 track_extra_parameters
;;;      默认值 IntervalStyle；
;;;   2) 本行白名单内 → 接受但**不应用**（官方语义：声明由管理员处理）；
;;;   3) 其余 → **直接报错**（失败优先），实测形如：
;;;      FATAL: unsupported startup parameter in options: search_path
;;;
;;; 注意「options 整体被丢弃」是误解，实测：
;;;   options=-c timezone=UTC      → 生效（timezone 属可跟踪集合）
;;;   options=-c search_path=foo   → 报错
;;;   options=-c extra_float_digits=0 → 通过（本行白名单）
;;;
;;; 因此 search_path 故意不白名单 —— 它不在可跟踪集合内，客户端一旦发送就明确
;;; 报错而非静默降级。固化 search_path 请走服务端（ALTER ROLE ... SET），
;;; 处置流程见 README。
;;; 本行只白名单 extra_float_digits（服务端已固化 extra_float_digits = 0）。
;;; ---------------------------------------------------------------------------
ignore_startup_parameters = extra_float_digits

services:
  pgbouncer:
    build:
      context: .
    container_name: pgbouncer
    restart: always
    # 不发布宿主机端口：仅 backend 内网可达（池化服务不应有宿主机暴露面，见 README.md）
    environment:
      # 后端 Postgres 的单一连接来源，由 .env 的 POSTGRES_* 合成（与 devtools/dokploy 一致）
      # 注意：它只服务于「启动等待」与「健康探针」；PgBouncer 真正的后端连接参数
      # 在 pgbouncer.ini 的 [databases] 段（含每库 pool_size），分工见 README.md
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # auth_query 的引导凭据；必须与 postgres-18 服务使用同一个值
      - PGBOUNCER_AUTH_PASSWORD=${PGBOUNCER_AUTH_PASSWORD}
    networks:
      - backend
    depends_on:
      - postgres

services:
  # 【必要】云原生存算分离架构：数据存储至 Garage S3 (Parquet) + 元数据存储至 PostgreSQL 18
  openobserve:
    image: openobserve/openobserve:v1.0.4
    container_name: openobserve
    restart: always
    environment:
      # 初始管理员凭证：只放 .env（邮箱必须带真实域名）
      - ZO_ROOT_USER_EMAIL=${OPENOBSERVE_ROOT_EMAIL:?请在 .env 设置 OPENOBSERVE_ROOT_EMAIL（需带真实域名）}
      - ZO_ROOT_USER_PASSWORD=${OPENOBSERVE_ROOT_PASSWORD:?请在 .env 设置 OPENOBSERVE_ROOT_PASSWORD}
      # 节点模式与架构：启用单机全功能模式，遥测数据持久化至 Garage S3
      - ZO_LOCAL_MODE=true
      - ZO_LOCAL_MODE_STORAGE=s3
      - ZO_NODE_ROLE=all # 单节点运行全部角色 (ingester/querier/compactor/router)
      # 对象存储 (Garage S3，Parquet 切片持久化)
      - ZO_S3_PROVIDER=s3
      - ZO_S3_SERVER_URL=http://garage:3900
      - ZO_S3_BUCKET_NAME=default
      - ZO_S3_REGION_NAME=garage
      - ZO_S3_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - ZO_S3_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY}
      # 存储压缩合并、遥测与路径参数
      - ZO_COMPACT_ENABLED=true
      - ZO_TELEMETRY=false # 禁用向官方回传匿名使用统计
      - ZO_DATA_DIR=/data
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      # 本地目录作为 SQLite 元数据持久化与 Parquet 写入缓冲缓存
      - ${DATA_PATH}open-observe:/data
    ports:
      # 限制本地监听，外部由 Caddy 反代 openobserve.{$SITE_ADDRESS} 接入
      - "127.0.0.1:5080:5080"
    healthcheck:
      # 镜像为 scratch 空基底，使用内置静态命令检查节点状态，无需 shell 或 curl
      test: ["CMD", "/openobserve", "node", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.2"
          memory: 512M
